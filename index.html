<!DOCTYPE html>
<html lang="ru">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Market Analyzer</title>
    
    <!-- Конфигурация для полноэкранного режима PWA на смартфонах -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Prompt Forge">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Исправленная иконка для iOS и Android -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%231e1b4b%22/><text y=%22.76em%22 x=%2210%22 font-size=%2270%22>🛒</text></svg>">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%231e1b4b%22/><text y=%22.76em%22 x=%2210%22 font-size=%2270%22>🛒</text></svg>">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --panel-bg: rgba(30, 41, 59, 0.7);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-primary: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --accent-hover: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
            --success-color: #10b981;
            --input-bg: rgba(15, 23, 42, 0.6);
            --mic-active: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            width: 100%;
            max-width: 640px;
            padding: 35px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="text"], textarea {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 14px 50px 14px 16px;
            color: var(--text-main);
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            line-height: 1.5;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background: rgba(15, 23, 42, 0.8);
        }

        .mic-btn {
            position: absolute;
            right: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: var(--text-main);
            transition: all 0.3s ease;
            font-size: 16px;
        }

        .mic-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }

        .mic-btn.recording {
            background: var(--mic-active);
            border-color: transparent;
            animation: pulse 1.5s infinite;
            color: #fff;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .btn-generate {
            width: 100%;
            background: var(--accent-primary);
            border: none;
            border-radius: 14px;
            padding: 16px;
            color: #white;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
            margin-bottom: 30px;
        }

        .btn-generate:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.4);
        }

        .btn-generate:active {
            transform: translateY(0);
        }

        .result-section {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .result-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .prompt-output {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 14px;
            font-size: 14px;
            line-height: 1.6;
            color: #e2e8f0;
            white-space: pre-wrap;
            min-height: 60px;
            border-left: 3px solid #a855f7;
        }

        .platforms-grid {
            display: grid;
            grid-template-columns: 1xl;
            gap: 12px;
            margin-top: 12px;
            margin-bottom: 24px;
        }

        .platform-option {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .platform-option:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .platform-option input[type="radio"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid var(--text-muted);
            border-radius: 50%;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .platform-option input[type="radio"]::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #a855f7;
            transform: scale(0);
            transition: transform 0.2s ease;
        }

        .platform-option input[type="radio"]:checked {
            border-color: #a855f7;
        }

        .platform-option input[type="radio"]:checked::before {
            transform: scale(1);
        }

        .platform-option.selected {
            background: rgba(168, 85, 247, 0.1);
            border-color: rgba(168, 85, 247, 0.4);
        }

        .platform-name {
            font-size: 15px;
            font-weight: 500;
        }

        .action-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .btn-action {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-copy {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid var(--panel-border);
        }

        .btn-copy:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-open {
            background: #ffffff;
            color: #0f172a;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
        }

        .btn-open:hover {
            background: #f1f5f9;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

<div class="app-container">
    <h1>🛒 Prompt Market Analyzer</h1>

    <div class="form-group">
        <label for="shopsInput">Сетевые магазины (через запятую):</label>
        <div class="input-wrapper">
            <input type="text" id="shopsInput" value="Пятерочка, Магнит, Перекресток, Лента">
            <button class="mic-btn" id="micShops" title="Диктовать">🎤</button>
        </div>
    </div>

    <div class="form-group">
        <label for="productsInput">Продуктовая корзина:</label>
        <div class="input-wrapper">
            <textarea id="productsInput" placeholder="Введите список продуктов..."></textarea>
            <button class="mic-btn" id="micProducts" title="Диктовать">🎤</button>
        </div>
    </div>

    <button class="btn-generate" onclick="generatePrompt()">Сформировать промпт</button>

    <div class="result-section">
        <div class="result-title">### Готовый промпт для ИИ:</div>
        <div class="prompt-output" id="promptOutput">Здесь появится ваш промпт...</div>
    </div>

    <div class="result-title">Куда отправить:</div>
    <div class="platforms-grid">
        <label class="platform-option selected" onclick="selectPlatform(this)">
            <input type="radio" name="ai_platform" value="google" checked>
            <span class="platform-name">Google AI (Поиск с ответами ИИ)</span>
        </label>
        <label class="platform-option" onclick="selectPlatform(this)">
            <input type="radio" name="ai_platform" value="chatgpt">
            <span class="platform-name">ChatGPT</span>
        </label>
        <label class="platform-option" onclick="selectPlatform(this)">
            <input type="radio" name="ai_platform" value="copilot">
            <span class="platform-name">Microsoft Copilot</span>
        </label>
    </div>

    <div class="action-actions">
        <button class="btn-action btn-copy" onclick="copyPrompt()">📋 Копировать</button>
        <button class="btn-action btn-open" onclick="openInAI()">🚀 Открыть в ИИ</button>
    </div>
</div>

<script>
    let currentPrompt = "";

    function selectPlatform(element) {
        document.querySelectorAll('.platform-option').forEach(opt => opt.classList.remove('selected'));
        element.classList.add('selected');
        const radio = element.querySelector('input[type="radio"]');
        if(radio) radio.checked = true;
    }

    function generatePrompt() {
        const shops = document.getElementById('shopsInput').value.trim();
        const products = document.getElementById('productsInput').value.trim();
        
        if (!products) {
            document.getElementById('promptOutput').innerText = "Пожалуйста, заполните продуктовую корзину перед генерацией.";
            return;
        }

        currentPrompt = `Сравни цены на продукты в указанных магазинах. Составь сравнительную таблицу. Выдели самую дешевую корзину. Выдавай ответ строго без воды и лишних вступлений.\n\nМагазины: ${shops}\nПродукты:\n${products}`;
        document.getElementById('promptOutput').innerText = currentPrompt;
    }

    function copyPrompt() {
        if (!currentPrompt) return;
        navigator.clipboard.writeText(currentPrompt).then(() => {
            const copyBtn = document.querySelector('.btn-copy');
            const originalText = copyBtn.innerHTML;
            copyBtn.innerHTML = "✅ Скопировано!";
            setTimeout(() => copyBtn.innerHTML = originalText, 2000);
        });
    }

    function openInAI() {
        if (!currentPrompt) return;
        const selectedRadio = document.querySelector('input[name="ai_platform"]:checked').value;
        let url = "";

        if (selectedRadio === "google") {
            url = `https://www.google.com/search?q=${encodeURIComponent(currentPrompt)}`;
        } else if (selectedRadio === "chatgpt") {
            url = `https://chatgpt.com/?q=${encodeURIComponent(currentPrompt)}`;
        } else if (selectedRadio === "copilot") {
            url = `https://copilot.microsoft.com/?q=${encodeURIComponent(currentPrompt)}`;
        }

        window.open(url, '_blank');
    }

    // Голосовой ввод Web Speech API
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
        setupVoiceInput('micShops', 'shopsInput', true);
        setupVoiceInput('micProducts', 'productsInput', false);
    } else {
        document.querySelectorAll('.mic-btn').forEach(btn => btn.style.display = 'none');
        console.log("Браузер не поддерживает Web Speech API");
    }

    function setupVoiceInput(btnId, inputId, isCommaSeparated) {
        const btn = document.getElementById(btnId);
        const input = document.getElementById(inputId);
        const recognition = new SpeechRecognition();

        recognition.lang = 'ru-RU';
        recognition.interimResults = false;

        btn.addEventListener('click', () => {
            if (btn.classList.contains('recording')) {
                recognition.stop();
            } else {
                recognition.start();
            }
        });

        recognition.onstart = () => {
            btn.classList.add('recording');
        };

        recognition.onend = () => {
            btn.classList.remove('recording');
        };

        recognition.onresult = (event) => {
            const resultText = event.results[0][0].transcript;
            let currentVal = input.value.trim();

            if (isCommaSeparated) {
                input.value = currentVal ? `${currentVal}, ${resultText}` : resultText;
            } else {
                input.value = currentVal ? `${currentVal}\n${resultText}` : resultText;
            }
            
            // Если изменяли textarea корзины, искусственно вызываем событие ввода
            input.dispatchEvent(new Event('input'));
        };
    }
</script>

</body>
</html>
